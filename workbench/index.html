<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>个人专属工作台</title>
<meta name="theme-color" content="#0d0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════ 启动页：黑底发光 X ══════════ -->
<div id="splash" class="splash">
  <div class="splash-x" id="splashX">
    <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
      <defs>
        <filter id="xglow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="xgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#c9b8ff"/>
        </linearGradient>
      </defs>
      <g filter="url(#xglow)" stroke="url(#xgrad)" stroke-width="13" stroke-linecap="round">
        <line x1="26" y1="26" x2="94" y2="94"/>
        <line x1="94" y1="26" x2="26" y2="94"/>
      </g>
    </svg>
  </div>
  <p class="splash-name">个人专属工作台</p>
</div>

<!-- ══════════ 锁屏页 ══════════ -->
<div id="lock" class="lock hidden">
  <div class="lock-card glass">
    <div id="lockPacha"></div>
    <h2 id="lockTitle">解锁工作台</h2>
    <p id="lockSub" class="dim">输入密码继续</p>
    <input id="lockInput" class="ginput" type="password" inputmode="text" autocomplete="off" placeholder="请输入密码" maxlength="64">
    <p id="lockError" class="lock-error hidden"></p>
    <button id="lockBtn" class="gbtn primary">进入</button>
    <p id="lockHint" class="dim small hidden"></p>
  </div>
</div>

<!-- ══════════ 主界面 ══════════ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-avatar" id="appAvatar">P</div>
      <div class="app-title-wrap">
        <h1 id="appTitle">个人专属工作台</h1>
        <p id="dateBar" class="datebar"></p>
      </div>
    </div>
    <div class="topbar-right">
      <button id="prevDayBtn" class="icon-btn" aria-label="上一天">‹</button>
      <button id="calBtn" class="icon-btn cal-btn" aria-label="日历">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      </button>
      <button id="nextDayBtn" class="icon-btn" aria-label="下一天">›</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-route="#/home"><span class="tab-ico" data-ico="home"></span><span class="tab-txt">首页</span></button>
    <button class="tab" data-route="#/record"><span class="tab-ico" data-ico="diet"></span><span class="tab-txt">记录</span></button>
    <button class="tab" data-route="#/mood"><span class="tab-ico" data-ico="mood"></span><span class="tab-txt">心情</span></button>
    <button class="tab" data-route="#/review"><span class="tab-ico" data-ico="review"></span><span class="tab-txt">复盘</span></button>
    <button class="tab" data-route="#/settings"><span class="tab-ico" data-ico="gear"></span><span class="tab-txt">设置</span></button>
  </nav>
</div>

<!-- ══════════ 日历弹层 ══════════ -->
<div id="calOverlay" class="overlay hidden">
  <div class="cal-panel glass">
    <div class="cal-head">
      <button id="calPrevMonth" class="icon-btn">‹</button>
      <h3 id="calMonthTitle"></h3>
      <button id="calNextMonth" class="icon-btn">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <button id="calTodayBtn" class="gbtn ghost small">今天</button>
      <button id="calCloseBtn" class="gbtn ghost small">关闭</button>
    </div>
  </div>
</div>

<!-- ══════════ 通用弹窗 ══════════ -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
